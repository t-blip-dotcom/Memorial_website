<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebration of life</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header" id="body">
        <div id="header-text">
            <p id="celebrating">CELEBRATING</p>
            <p style="font-size: 30px;">THE</p>
            <p style="font-size: 40px;">LIVES</p>
            <p style="font-size:25px">OF</p>
            <p style="font-size: 40px;">Cecilia Kahoro</p>
            <p style="font-size: 35px;">And</p>
            <p style="font-size: 40px;">Joel Kahoro</p>
        </div>
        <div id="header-image">
            <img src="" alt="Image of the Deceased">
        </div>


    </div>
    <hr>

    <div class="about-lives">
        <p id="lives" style="font-weight: bold; font-size: 30px;">ABOUT THEIR LIVES</p>
        <div class="narrations">
            <div class="lives" id="cecilia">
            </div>
            <div class="lives" id="joel">
            </div>
        </div>
    </div>
    <hr>
    <div class="Memories">
        <p style="font-weight: bold; font-size: 30px;">MEMORIES</p>
        <div class="cards">
       
            <button id="add-memory-btn">
                <img id="plus" src="black plus.png" alt="Plus Sign">
                <p>Add New Memory</p>
            </button>

            <div id="memory-form-container" class="modal-overlay">
                <div class="modal-box">
                    <span id="close-modal">&times;</span>
                    <textarea id="memory-description" placeholder="Describe this memory..."></textarea>
                    <input type="file" id="memory-photo" accept="image/*">

                    <div id="photo-preview-wrap" class="photo-preview-wrap">
                        <img id="photo-preview" alt="Photo preview">
                        <div class="rotate-controls">
                            <button type="button" id="rotate-left" title="Rotate left">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw">
                                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                                    <path d="M3 3v5h5" />
                                     </svg>
                            </button>
                            <button type="button" id="rotate-right" title="Rotate right">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-cw">
                                    <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                                    <path d="M21 3v5h-5" />
                                    </svg>
                                </button>
                        </div>
                    </div>

                    <button id="submit-memory-btn">Submit</button>
                </div>
            </div>

        </div>
    </div>
    <hr>
    <footer>~Forever In Our Hearts~</footer>

    <div id="toast" class="toast"></div>

    <div id="lightbox" class="lightbox-overlay">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" alt="Full size memory photo">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>

</html>
